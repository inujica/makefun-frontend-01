<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="A fast read-only make.fun frontend: live bounty board, bounty pages, leaderboards, profiles.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>make.fun bounties</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0a0e13;--c:#121b24;--c2:#182430;--fg:#e8eef6;--d:#b4c3d0;--ok:#43e08a;--w:#f7c948;--bad:#ff8b82;--lk:#8cc8ff;--bd:1px solid #26343f;--r:12px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--lk);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,p{margin:0}h1{font-size:1.3rem;line-height:1.25}h2{font-size:.95rem}h3{font-size:.9rem}p{margin:.45em 0}
ul{margin:.35em 0;padding-left:18px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;clip:rect(0 0 0 0);overflow:hidden}
header{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:7px 9px;padding:8px 12px;background:#0b1016;border-bottom:var(--bd)}
.brand{color:var(--fg);font-weight:700;white-space:nowrap}.brand b{color:var(--ok)}
.find{order:3;flex:1 1 100%;min-width:0}
#q{width:100%;padding:7px 12px;border:var(--bd);border-radius:99px;background:var(--c);color:var(--fg);font:inherit;font-size:.88rem}
#q:focus{outline:2px solid var(--lk)}
#net{margin-left:auto;font-size:.75rem;color:var(--d);white-space:nowrap}
#go{width:32px;height:32px;border:var(--bd);border-radius:50%;background:var(--c);color:var(--fg);cursor:pointer}
main{max-width:960px;margin:0 auto;padding:12px 12px 60px}
.crumbs,.sub{font-size:.85rem;color:var(--d)}.crumbs{margin-bottom:8px}.sub{margin:2px 0 10px}
.card,.skel,.sol,.stat,.vlist{border:var(--bd);border-radius:var(--r);background:var(--c)}
.vlist{position:relative;overflow-y:auto;height:calc(100vh - 236px);min-height:320px;overscroll-behavior:contain}
.vspacer{width:1px}.vwin{position:absolute;top:0;left:0;right:0}
.vwin>*{height:var(--rowh,64px)}
.board{--rowh:116px}.lb{--rowh:64px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:center;gap:2px 10px;padding:8px 12px;border-top:var(--bd);color:inherit}
.row:hover{background:var(--c2);text-decoration:none}
.title{grid-column:1;font-weight:600;line-height:1.25;max-height:2.5em;overflow:hidden}
.pot{grid-column:2;grid-row:1/3;align-self:center;text-align:right;font-size:1.3rem;font-weight:800;color:var(--ok)}
.line{grid-column:1;display:flex;align-items:center;gap:8px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.meta{margin-left:auto;display:flex;align-items:center;gap:5px;min-width:0;font-size:.75rem;color:var(--d);white-space:nowrap}
.cat{display:block;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.chev{color:var(--fg);font-weight:700;flex:0 0 auto}
.row:hover .chev{transform:translateX(2px)}
.chip{padding:2px 8px;border:var(--bd);border-radius:99px;font-size:.75rem;color:var(--d);white-space:nowrap}
.chip.fee{background:var(--c2);color:var(--fg)}.chip.time{color:var(--fg)}
.chip.soon{background:var(--w);color:#0a0e13;font-weight:700}
.card,.sol,.stat{padding:12px}.card{margin-bottom:12px}
.potline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.potline .pot{font-size:2rem;text-align:left}
.split{display:grid;gap:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.85rem;margin:0}
.facts dt{color:var(--d)}.facts dd{margin:0}
.btn{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:99px;background:var(--ok);color:#08130c;font-weight:700;font-size:.88rem}
.prose{font-size:.9rem}.prose h3{margin:14px 0 4px;color:var(--ok)}
.lbrow{display:grid;gap:8px;padding:0 10px;align-items:center;border-top:var(--bd);color:inherit}
.lbrow:hover{background:var(--c2);text-decoration:none}
.rank{font-weight:700;color:var(--d);text-align:right}.rank.prize{color:var(--ok)}
.who{min-width:0;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who em{display:block;font-style:normal;font-weight:400;font-size:.76rem;color:var(--d);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.val{text-align:right;font-size:.82rem;font-weight:600}
.prof{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.av{width:56px;height:56px;border-radius:50%;border:var(--bd);background:var(--c2);object-fit:cover}
.avf{display:grid;place-items:center;border-radius:50%;border:var(--bd);background:hsl(var(--h,210) 40% 30%);color:#eaf2fa;font-weight:700;text-transform:uppercase}
.end{margin:14px 0 0;padding:12px 0 2px;border-top:var(--bd);text-align:center;font-size:.8rem;color:var(--d)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin-bottom:12px}
.stat b{display:block;font-size:1.05rem}
.stat span{font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--d)}
.sol{display:block;color:inherit;margin-bottom:7px}
.sol:hover{background:var(--c2);text-decoration:none}
.sol b{font-size:.88rem}.sol em{display:block;font-style:normal;font-size:.76rem;color:var(--d)}
.btn.ghost{background:var(--c);color:var(--fg);border:var(--bd);font-size:.85rem;cursor:pointer}
.skel{height:76px;margin-bottom:8px;animation:pulse 1.1s ease-in-out infinite}
.err{border-color:var(--bad);padding:14px}
@media(min-width:700px){.find{order:0;flex:1 1 240px}.board{--rowh:96px}.vlist{height:calc(100vh - 240px)}.split{grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);align-items:start}.split aside{position:sticky;top:60px}}
@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<header>
<a class="brand" href="#/"><b>make.fun</b> bounties</a>
<label class="find"><span class="sr">Filter bounties by title</span><input id="q" type="search" placeholder="Filter bounties by title…" autocomplete="off" spellcheck="false"></label>
<span id="net" title="Requests this session made to make.fun's API, and answers served from cache">no data yet</span>
<button id="go" type="button" title="Refresh this view: revalidate its cached answers" aria-label="Refresh this view">⟳</button>
</header>
<main id="app"></main>
<script type="module" src="main.js"></script>
</body>
</html>
